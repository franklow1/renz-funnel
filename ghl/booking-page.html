<!-- =====================================================================
     GoHighLevel · the booking / thank you page ("You're In")
     Paste into a Custom Code / HTML element on the page, once.
     The page also carries the GHL calendar element; this page reads
     the booked slot off it and never invents a time.
     ===================================================================== -->
<style id="rz-veil-css">html,body{background:#F4F1EA!important}#rz-veil{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483000;background:#F4F1EA}</style>
<div id="rz-veil"></div>
<div id="rz-thanks-mount"></div>
<script id="rz-src" src="https://franklow1.github.io/renz-funnel/thanks.js" defer></script>
<script>
/* If the file never arrives, the sheet of paper over the page must still come off,
   or the visitor is left looking at a blank rectangle with the builder's own page
   hidden underneath it. Both the error handler and the timeout below do the same
   one job, because a script that 404s fires onerror and a script that hangs does not. */
(function(){
  function lift(){
    var v=document.getElementById('rz-veil'); if(v&&v.parentNode) v.parentNode.removeChild(v);
    var c=document.getElementById('rz-veil-css'); if(c&&c.parentNode) c.parentNode.removeChild(c);
  }
  var s=document.getElementById('rz-src');
  if(s) s.addEventListener('error', lift);
  setTimeout(function(){ if(!window.__rzSettled && !document.getElementById('rz-funnel')) lift(); }, 12000);
})();
</script>
